#
# pacman configuration for AArch64 ISO builds from the stable channel.
#
# Arch Linux ARM provides the base distribution, from KDX's own mirror of
# it for this channel (arm-mirror.kdx.org for edge, arm-rc-mirror and
# arm-stable-mirror for rc and stable), and pkgs.kdx.org the [kdx]
# repo. The [platform] repo is the package bundle mounted at /packages (see
# --package-dir), indexed by repo-add at build time. A build without a bundle
# drops it.

[options]
HoldPkg     = pacman glibc
Architecture = aarch64
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Order is precedence: pacman takes the first repository that carries a package
# name. The bundle pins a kernel under test and anything held at a version
# proven on the hardware; [kdx] carries builds that must win over Arch
# Linux ARM's (Hyprland against the current aquamarine).
[platform]
SigLevel = Optional TrustAll
Server = file:///packages

[kdx]
Server = https://pkgs.kdx.org/stable/$arch

[core]
Server = https://arm-stable-mirror.kdx.org/$arch/$repo

[extra]
Server = https://arm-stable-mirror.kdx.org/$arch/$repo

[alarm]
Server = https://arm-stable-mirror.kdx.org/$arch/$repo

[aur]
Server = https://arm-stable-mirror.kdx.org/$arch/$repo
