LABEL arch64
TEXT HELP
Boot the KDX install medium on BIOS.
It allows you to install KDX or perform system maintenance.
ENDTEXT
MENU LABEL KDX install medium (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-kdx
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-kdx.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n initramfs_options=size=90% quiet splash xe.enable_panel_replay=0 initramfs_async=0

# Accessibility boot option
LABEL arch64speech
TEXT HELP
Boot the KDX install medium on BIOS with speakup screen reader.
It allows you to install KDX or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL KDX install medium (x86_64, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-kdx
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-kdx.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n initramfs_options=size=90% accessibility=on xe.enable_panel_replay=0 initramfs_async=0
